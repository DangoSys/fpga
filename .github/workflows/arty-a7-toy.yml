name: Arty A7 Toy source and interface checks

on:
  pull_request:
    paths:
      - 'platforms/arty-a7-toy/**'
      - 'history/**'
      - '.github/workflows/arty-a7-toy.yml'
  push:
    branches: [main]
    paths:
      - 'platforms/arty-a7-toy/**'
      - 'history/**'
      - '.github/workflows/arty-a7-toy.yml'

permissions:
  contents: read

jobs:
  source-and-interfaces:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify pinned sources and recorded evidence
        working-directory: platforms/arty-a7-toy
        run: |
          python3 scripts/verify_target.py
          python3 scripts/verify_pr10_evidence.py
          python3 scripts/verify_rob_evidence.py
          python3 scripts/verify_rob_pr10_full.py
          python3 scripts/verify_linux_gemmini_archive.py
          python3 scripts/verify_linux_gemmini.py --build-record ../../history/02-toy-linux/uart/linux-gemmini/2026-10-12/build/LINUX_GEMMINI_BUILD.json --hardware-result ../../history/02-toy-linux/uart/linux-gemmini/2026-10-12/hardware/RESULT.json --expected-bit-sha256 ccc33c511e613561fb9dd1e9c847bd3b84037da1d078c44cd3de197d55dffde1
          python3 -m compileall -q scripts tests host software
          bash -n scripts/elaborate.sh scripts/elaborate_rob_candidate.sh scripts/build_test_programs.sh software/build.sh
      - name: Install interface simulator
        run: sudo apt-get update && sudo apt-get install -y iverilog tcl
      - name: AXI, UART/SCU and DDR loader interface tests
        working-directory: platforms/arty-a7-toy
        run: |
          timeout --signal=TERM --kill-after=15s 180s python3 scripts/check_board.py
          python3 scripts/check_programming_scripts.py
          python3 scripts/check_flash_guards.py
          python3 scripts/check_runner_status.py
          python3 scripts/check_platform_mutations.py
